services:
  # PostgreSQL数据库（生产环境推荐）
  db:
    image: postgres:15-alpine
    container_name: fieldmind-db
    environment:
      POSTGRES_USER: fieldmind
      POSTGRES_PASSWORD: fieldmind_password
      POSTGRES_DB: fieldmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: fieldmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j图数据库
  neo4j:
    image: neo4j:5.14
    container_name: fieldmind-neo4j
    environment:
      NEO4J_AUTH: neo4j/fieldmind_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p fieldmind_password 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 后端API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fieldmind-backend
    environment:
      - DATABASE_URL=postgresql://fieldmind:fieldmind_password@db:5432/fieldmind
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=fieldmind_password
      - SECRET_KEY=your-secret-key-change-in-production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fieldmind-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
