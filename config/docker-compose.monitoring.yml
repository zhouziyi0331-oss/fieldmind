version: '3.8'

services:
  # ============================================================================
  # Prometheus - 指标收集和存储
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: fieldmind-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - fieldmind-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Alertmanager - 告警管理和路由
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: fieldmind-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - fieldmind-network
    environment:
      - SMTP_PASSWORD=${SMTP_PASSWORD:-changeme}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}

  # ============================================================================
  # Grafana - 可视化仪表板
  # ============================================================================
  grafana:
    image: grafana/grafana:10.0.3
    container_name: fieldmind-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false
    ports:
      - "3000:3000"
    networks:
      - fieldmind-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Node Exporter - 系统指标
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: fieldmind-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - fieldmind-network

  # ============================================================================
  # Postgres Exporter - PostgreSQL指标
  # ============================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.13.2
    container_name: fieldmind-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-fieldmind}:${POSTGRES_PASSWORD:-fieldmind123}@postgres:5432/${POSTGRES_DB:-fieldmind}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - fieldmind-network
    depends_on:
      - postgres

  # ============================================================================
  # Redis Exporter - Redis指标
  # ============================================================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.52.0
    container_name: fieldmind-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      - "9121:9121"
    networks:
      - fieldmind-network
    depends_on:
      - redis

  # ============================================================================
  # Celery Exporter - Celery任务指标
  # ============================================================================
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    container_name: fieldmind-celery-exporter
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
    ports:
      - "9540:9540"
    networks:
      - fieldmind-network
    depends_on:
      - redis

networks:
  fieldmind-network:
    external: true

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
