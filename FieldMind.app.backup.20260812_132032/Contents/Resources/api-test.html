<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldMind API测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .test-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .test-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        .test-card p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            width: 100%;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 30px;
            max-height: 400px;
            overflow-y: auto;
        }
        .result h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        .result pre {
            background: #2d3748;
            color: #48bb78;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.85em;
            line-height: 1.5;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 10px;
        }
        .status.success {
            background: #c6f6d5;
            color: #22543d;
        }
        .status.error {
            background: #fed7d7;
            color: #742a2a;
        }
        .status.pending {
            background: #fefcbf;
            color: #744210;
        }
        .clear-btn {
            background: #e53e3e;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 FieldMind API 测试工具</h1>

        <div class="test-grid">
            <!-- 1. Projects -->
            <div class="test-card">
                <h3>📁 项目管理</h3>
                <p>测试项目列表获取</p>
                <button onclick="testProjects()">测试 GET /api/projects</button>
            </div>

            <!-- 2. Files -->
            <div class="test-card">
                <h3>📄 文件管理</h3>
                <p>测试文件列表获取</p>
                <button onclick="testFiles()">测试 GET /api/files</button>
            </div>

            <!-- 3. Keywords -->
            <div class="test-card">
                <h3>🔑 关键词</h3>
                <p>测试关键词获取</p>
                <button onclick="testKeywords()">测试 GET /api/keywords</button>
            </div>

            <!-- 4. Search -->
            <div class="test-card">
                <h3>🔍 搜索</h3>
                <p>测试搜索功能</p>
                <button onclick="testSearch()">测试 GET /api/search</button>
            </div>

            <!-- 5. Stats -->
            <div class="test-card">
                <h3>📊 统计</h3>
                <p>测试关键词统计</p>
                <button onclick="testStats()">测试 GET /api/stats/keywords</button>
            </div>

            <!-- 6. Graph -->
            <div class="test-card">
                <h3>🕸️ 知识图谱</h3>
                <p>测试图谱数据</p>
                <button onclick="testGraph()">测试 GET /api/graph</button>
            </div>

            <!-- 7. Conversations -->
            <div class="test-card">
                <h3>💬 对话管理</h3>
                <p>测试对话历史</p>
                <button onclick="testConversations()">测试 GET /api/conversations</button>
            </div>

            <!-- 8. Business -->
            <div class="test-card">
                <h3>🏢 业态分析</h3>
                <p>测试业态报告</p>
                <button onclick="testBusiness()">测试 GET /api/business/report</button>
            </div>

            <!-- 9. Timeline -->
            <div class="test-card">
                <h3>⏰ 时间线</h3>
                <p>测试时间线事件</p>
                <button onclick="testTimeline()">测试 GET /api/timeline/events</button>
            </div>

            <!-- 10. Database Status -->
            <div class="test-card">
                <h3>💾 数据库状态</h3>
                <p>检查数据库连接</p>
                <button onclick="testDatabaseStatus()">测试数据库</button>
            </div>

            <!-- 11. Test All -->
            <div class="test-card">
                <h3>🚀 批量测试</h3>
                <p>测试所有已实现接口</p>
                <button onclick="testAll()">运行全部测试</button>
            </div>

            <!-- 12. Clear Results -->
            <div class="test-card">
                <h3>🧹 清除结果</h3>
                <p>清空测试输出</p>
                <button class="clear-btn" onclick="clearResults()">清除输出</button>
            </div>
        </div>

        <div class="result" id="result">
            <h2>测试结果 <span id="status" class="status pending">待测试</span></h2>
            <pre id="output">等待测试...</pre>
        </div>
    </div>

    <script>
        let testResults = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : '📝';
            testResults.push(`[${timestamp}] ${prefix} ${message}`);
            updateOutput();
        }

        function updateOutput() {
            document.getElementById('output').textContent = testResults.join('\n');
        }

        function setStatus(status) {
            const statusEl = document.getElementById('status');
            statusEl.className = `status ${status}`;
            statusEl.textContent = status === 'success' ? '成功' : status === 'error' ? '失败' : '测试中';
        }

        function clearResults() {
            testResults = [];
            updateOutput();
            setStatus('pending');
            document.getElementById('output').textContent = '已清除输出...';
        }

        async function testAPI(endpoint, params = {}) {
            try {
                log(`\n🔵 开始测试: ${endpoint}`);
                log(`📤 请求参数: ${JSON.stringify(params)}`);

                const result = await window.FieldMindAPI.call(endpoint, params);

                log(`📥 响应: ${JSON.stringify(result, null, 2)}`, 'success');
                return result;
            } catch (error) {
                log(`错误: ${error.message}`, 'error');
                throw error;
            }
        }

        async function testProjects() {
            setStatus('pending');
            try {
                const projects = await testAPI('/api/projects');
                log(`✅ 获取到 ${projects.projects?.length || 0} 个项目`, 'success');
                setStatus('success');
            } catch (error) {
                setStatus('error');
            }
        }

        async function testFiles() {
            setStatus('pending');
            try {
                const files = await testAPI('/api/files', { project_id: 1 });
                log(`✅ 获取到 ${files.files?.length || 0} 个文件`, 'success');
                setStatus('success');
            } catch (error) {
                setStatus('error');
            }
        }

        async function testKeywords() {
            setStatus('pending');
            try {
                const keywords = await testAPI('/api/keywords');
                log(`✅ 获取到 ${keywords.keywords?.length || 0} 个关键词`, 'success');
                setStatus('success');
            } catch (error) {
                setStatus('error');
            }
        }

        async function testSearch() {
            setStatus('pending');
            try {
                const results = await testAPI('/api/search', { query: '测试' });
                log(`✅ 搜索到 ${results.files?.length || 0} 个文件, ${results.keywords?.length || 0} 个关键词`, 'success');
                setStatus('success');
            } catch (error) {
                setStatus('error');
            }
        }

        async function testStats() {
            setStatus('pending');
            try {
                const stats = await testAPI('/api/stats/keywords', { project_id: 1 });
                log(`✅ 统计完成`, 'success');
                setStatus('success');
            } catch (error) {
                setStatus('error');
            }
        }

        async function testGraph() {
            setStatus('pending');
            try {
                const graph = await testAPI('/api/graph', { project_id: 1 });
                log(`✅ 获取到 ${graph.nodes?.length || 0} 个节点, ${graph.edges?.length || 0} 条边`, 'success');
                setStatus('success');
            } catch (error) {
                setStatus('error');
            }
        }

        async function testConversations() {
            setStatus('pending');
            try {
                const conversations = await testAPI('/api/conversations', { project_id: 1, limit: 10 });
                log(`✅ 获取到 ${conversations.messages?.length || 0} 条消息`, 'success');
                setStatus('success');
            } catch (error) {
                setStatus('error');
            }
        }

        async function testBusiness() {
            setStatus('pending');
            try {
                const report = await testAPI('/api/business/report', { project_id: 1 });
                log(`✅ 获取业态报告成功`, 'success');
                setStatus('success');
            } catch (error) {
                setStatus('error');
            }
        }

        async function testTimeline() {
            setStatus('pending');
            try {
                const timeline = await testAPI('/api/timeline/events', { project_id: 1 });
                log(`✅ 获取到 ${timeline.events?.length || 0} 个时间线事件`, 'success');
                setStatus('success');
            } catch (error) {
                setStatus('error');
            }
        }

        async function testDatabaseStatus() {
            setStatus('pending');
            try {
                log('🔍 检查数据库连接...');
                const projects = await testAPI('/api/projects');
                const files = await testAPI('/api/files', { project_id: 1 });
                const keywords = await testAPI('/api/keywords');

                log(`✅ 数据库连接正常`, 'success');
                log(`📊 项目数: ${projects.projects?.length || 0}`, 'info');
                log(`📊 文件数: ${files.files?.length || 0}`, 'info');
                log(`📊 关键词数: ${keywords.keywords?.length || 0}`, 'info');
                setStatus('success');
            } catch (error) {
                log('❌ 数据库连接失败', 'error');
                setStatus('error');
            }
        }

        async function testAll() {
            clearResults();
            setStatus('pending');
            log('🚀 开始批量测试所有API端点...\n');

            const tests = [
                { name: '项目管理', fn: testProjects },
                { name: '文件管理', fn: testFiles },
                { name: '关键词', fn: testKeywords },
                { name: '搜索', fn: testSearch },
                { name: '统计', fn: testStats },
                { name: '知识图谱', fn: testGraph },
                { name: '对话管理', fn: testConversations },
                { name: '业态分析', fn: testBusiness },
                { name: '时间线', fn: testTimeline }
            ];

            let passed = 0;
            let failed = 0;

            for (const test of tests) {
                try {
                    log(`\n━━━━━━━━━━━━━━━━━━━━━━━━`);
                    log(`测试模块: ${test.name}`);
                    await test.fn();
                    passed++;
                } catch (error) {
                    failed++;
                }
            }

            log(`\n━━━━━━━━━━━━━━━━━━━━━━━━`);
            log(`\n📊 测试总结:`);
            log(`✅ 通过: ${passed}/${tests.length}`);
            log(`❌ 失败: ${failed}/${tests.length}`);
            log(`📈 成功率: ${((passed / tests.length) * 100).toFixed(1)}%`);

            setStatus(failed === 0 ? 'success' : 'error');
        }

        // 页面加载完成后检查API可用性
        window.addEventListener('DOMContentLoaded', () => {
            if (window.FieldMindAPI) {
                log('✅ Swift Bridge已加载', 'success');
                log('📡 可用的API模块:', 'info');
                Object.keys(window.FieldMindAPI).forEach(key => {
                    if (typeof window.FieldMindAPI[key] === 'object') {
                        log(`  - ${key}`, 'info');
                    }
                });
            } else {
                log('❌ Swift Bridge未加载，API不可用', 'error');
                setStatus('error');
            }
        });
    </script>
</body>
</html>
