<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldMind 完整API测试</title>
    <script src="swift-bridge.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 36px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .module-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .module-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        }
        .module-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .module-icon {
            font-size: 24px;
        }
        .module-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .module-status {
            margin-left: auto;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-ready { background: #d4edda; color: #155724; }
        .status-testing { background: #fff3cd; color: #856404; }
        .status-error { background: #f8d7da; color: #721c24; }
        .test-btn {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .test-btn:hover {
            opacity: 0.9;
        }
        .test-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .summary {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .summary h2 {
            margin-bottom: 15px;
            color: #333;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #667eea;
        }
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .test-all-btn {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .test-all-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 FieldMind 完整API测试</h1>

        <div class="summary">
            <h2>测试统计</h2>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="total-tests">0</div>
                    <div class="stat-label">总测试</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="passed-tests" style="color: #28a745;">0</div>
                    <div class="stat-label">通过</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="failed-tests" style="color: #dc3545;">0</div>
                    <div class="stat-label">失败</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="success-rate">0%</div>
                    <div class="stat-label">成功率</div>
                </div>
            </div>
            <button class="test-all-btn" onclick="runAllTests()">🚀 运行所有测试</button>
        </div>

        <div class="module-grid">
            <!-- 1. 项目管理 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">📁</span>
                    <span class="module-title">项目管理</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testProjects()">测试获取所有项目</button>
                <div id="result-projects" class="result" style="display:none;"></div>
            </div>

            <!-- 2. 文件管理 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">📄</span>
                    <span class="module-title">文件管理</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testFiles()">测试获取文件</button>
                <div id="result-files" class="result" style="display:none;"></div>
            </div>

            <!-- 3. 关键词引擎 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">🔑</span>
                    <span class="module-title">关键词引擎</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testKeywords()">测试获取关键词</button>
                <div id="result-keywords" class="result" style="display:none;"></div>
            </div>

            <!-- 4. 搜索功能 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">🔍</span>
                    <span class="module-title">搜索功能</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testSearch()">测试搜索</button>
                <div id="result-search" class="result" style="display:none;"></div>
            </div>

            <!-- 5. 知识图谱 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">🕸️</span>
                    <span class="module-title">知识图谱</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testGraph()">测试图谱数据</button>
                <div id="result-graph" class="result" style="display:none;"></div>
            </div>

            <!-- 6. 对话管理 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">💬</span>
                    <span class="module-title">对话管理</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testConversations()">测试对话历史</button>
                <div id="result-conversations" class="result" style="display:none;"></div>
            </div>

            <!-- 7. 智能体 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">🤖</span>
                    <span class="module-title">智能体</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testAgent()">测试智能对话</button>
                <button class="test-btn" onclick="testAgentStatus()">测试状态查询</button>
                <div id="result-agent" class="result" style="display:none;"></div>
            </div>

            <!-- 8. 思维模型 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">🧠</span>
                    <span class="module-title">思维模型</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testThinkingModels()">测试模型列表</button>
                <button class="test-btn" onclick="testSwotAnalysis()">测试SWOT分析</button>
                <button class="test-btn" onclick="test5W2H()">测试5W2H分析</button>
                <div id="result-thinking" class="result" style="display:none;"></div>
            </div>

            <!-- 9. SOP验证 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">✅</span>
                    <span class="module-title">SOP验证</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testSopTemplates()">测试SOP模板</button>
                <button class="test-btn" onclick="testSopValidate()">测试流程验证</button>
                <div id="result-sop" class="result" style="display:none;"></div>
            </div>

            <!-- 10. 业态分析 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">🏪</span>
                    <span class="module-title">业态分析</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testBusinessAnalyze()">测试业态分析</button>
                <div id="result-business" class="result" style="display:none;"></div>
            </div>

            <!-- 11. 时间线 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">⏱️</span>
                    <span class="module-title">时间线</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testTimelineGenerate()">测试生成时间线</button>
                <div id="result-timeline" class="result" style="display:none;"></div>
            </div>

            <!-- 12. 叙事生成 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">📝</span>
                    <span class="module-title">叙事生成</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testNarrativeTemplates()">测试叙事模板</button>
                <button class="test-btn" onclick="testNarrativeGenerate()">测试生成叙事</button>
                <div id="result-narrative" class="result" style="display:none;"></div>
            </div>

            <!-- 13. 媒体文件 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">🎬</span>
                    <span class="module-title">媒体文件</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testMediaAccess()">测试媒体访问</button>
                <div id="result-media" class="result" style="display:none;"></div>
            </div>

            <!-- 14. 资料导入 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">📥</span>
                    <span class="module-title">资料导入</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testIngestStatus()">测试导入状态</button>
                <div id="result-ingest" class="result" style="display:none;"></div>
            </div>

            <!-- 15. 统计数据 -->
            <div class="module-card">
                <div class="module-header">
                    <span class="module-icon">📊</span>
                    <span class="module-title">统计数据</span>
                    <span class="module-status status-ready">就绪</span>
                </div>
                <button class="test-btn" onclick="testStats()">测试统计查询</button>
                <div id="result-stats" class="result" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        let testResults = {
            total: 0,
            passed: 0,
            failed: 0
        };

        function updateStats() {
            document.getElementById('total-tests').textContent = testResults.total;
            document.getElementById('passed-tests').textContent = testResults.passed;
            document.getElementById('failed-tests').textContent = testResults.failed;
            const rate = testResults.total > 0
                ? Math.round((testResults.passed / testResults.total) * 100)
                : 0;
            document.getElementById('success-rate').textContent = rate + '%';
        }

        function showResult(elementId, success, data) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = 'result ' + (success ? 'success' : 'error');
            element.textContent = JSON.stringify(data, null, 2);

            testResults.total++;
            if (success) testResults.passed++;
            else testResults.failed++;
            updateStats();
        }

        // 1. 项目管理
        async function testProjects() {
            try {
                const result = await window.FieldMindAPI.projects.getAll();
                showResult('result-projects', true, result);
            } catch (error) {
                showResult('result-projects', false, { error: error.message });
            }
        }

        // 2. 文件管理
        async function testFiles() {
            try {
                const result = await window.FieldMindAPI.files.getByProject(1);
                showResult('result-files', true, result);
            } catch (error) {
                showResult('result-files', false, { error: error.message });
            }
        }

        // 3. 关键词
        async function testKeywords() {
            try {
                const result = await window.FieldMindAPI.keywords.getAll();
                showResult('result-keywords', true, result);
            } catch (error) {
                showResult('result-keywords', false, { error: error.message });
            }
        }

        // 4. 搜索
        async function testSearch() {
            try {
                const result = await window.FieldMindAPI.search.query('测试', 1);
                showResult('result-search', true, result);
            } catch (error) {
                showResult('result-search', false, { error: error.message });
            }
        }

        // 5. 知识图谱
        async function testGraph() {
            try {
                const result = await window.FieldMindAPI.graph.getNodes(1);
                showResult('result-graph', true, result);
            } catch (error) {
                showResult('result-graph', false, { error: error.message });
            }
        }

        // 6. 对话管理
        async function testConversations() {
            try {
                const result = await window.FieldMindAPI.conversations.getHistory(1, 10);
                showResult('result-conversations', true, result);
            } catch (error) {
                showResult('result-conversations', false, { error: error.message });
            }
        }

        // 7. 智能体
        async function testAgent() {
            try {
                const result = await window.FieldMindAPI.agent.chat(1, '你好，请帮我分析项目数据');
                showResult('result-agent', true, result);
            } catch (error) {
                showResult('result-agent', false, { error: error.message });
            }
        }

        async function testAgentStatus() {
            try {
                const result = await window.FieldMindAPI.agent.getStatus();
                showResult('result-agent', true, result);
            } catch (error) {
                showResult('result-agent', false, { error: error.message });
            }
        }

        // 8. 思维模型
        async function testThinkingModels() {
            try {
                const result = await window.FieldMindAPI.thinkingModel.getModels();
                showResult('result-thinking', true, result);
            } catch (error) {
                showResult('result-thinking', false, { error: error.message });
            }
        }

        async function testSwotAnalysis() {
            try {
                const result = await window.FieldMindAPI.thinkingModel.analyze('swot', '项目分析内容', 1);
                showResult('result-thinking', true, result);
            } catch (error) {
                showResult('result-thinking', false, { error: error.message });
            }
        }

        async function test5W2H() {
            try {
                const result = await window.FieldMindAPI.thinkingModel.analyze('5w2h', '问题分析内容', 1);
                showResult('result-thinking', true, result);
            } catch (error) {
                showResult('result-thinking', false, { error: error.message });
            }
        }

        // 9. SOP验证
        async function testSopTemplates() {
            try {
                const result = await window.FieldMindAPI.sop.getTemplates();
                showResult('result-sop', true, result);
            } catch (error) {
                showResult('result-sop', false, { error: error.message });
            }
        }

        async function testSopValidate() {
            try {
                const result = await window.FieldMindAPI.sop.validate('field-research', ['前期准备', '实地考察', '访谈记录']);
                showResult('result-sop', true, result);
            } catch (error) {
                showResult('result-sop', false, { error: error.message });
            }
        }

        // 10. 业态分析
        async function testBusinessAnalyze() {
            try {
                const result = await window.FieldMindAPI.business.analyze(1, {});
                showResult('result-business', true, result);
            } catch (error) {
                showResult('result-business', false, { error: error.message });
            }
        }

        // 11. 时间线
        async function testTimelineGenerate() {
            try {
                const result = await window.FieldMindAPI.timeline.generate(1);
                showResult('result-timeline', true, result);
            } catch (error) {
                showResult('result-timeline', false, { error: error.message });
            }
        }

        // 12. 叙事生成
        async function testNarrativeTemplates() {
            try {
                const result = await window.FieldMindAPI.narrative.getTemplates();
                showResult('result-narrative', true, result);
            } catch (error) {
                showResult('result-narrative', false, { error: error.message });
            }
        }

        async function testNarrativeGenerate() {
            try {
                const result = await window.FieldMindAPI.narrative.generate(1, 'academic', 'medium');
                showResult('result-narrative', true, result);
            } catch (error) {
                showResult('result-narrative', false, { error: error.message });
            }
        }

        // 13. 媒体文件
        async function testMediaAccess() {
            try {
                const result = await window.FieldMindAPI.media.get(1);
                showResult('result-media', true, result);
            } catch (error) {
                showResult('result-media', false, { error: error.message });
            }
        }

        // 14. 资料导入
        async function testIngestStatus() {
            try {
                const result = await window.FieldMindAPI.ingest.getStatus();
                showResult('result-ingest', true, result);
            } catch (error) {
                showResult('result-ingest', false, { error: error.message });
            }
        }

        // 15. 统计数据
        async function testStats() {
            try {
                const result = await window.FieldMindAPI.stats.keywords(1);
                showResult('result-stats', true, result);
            } catch (error) {
                showResult('result-stats', false, { error: error.message });
            }
        }

        // 运行所有测试
        async function runAllTests() {
            testResults = { total: 0, passed: 0, failed: 0 };
            updateStats();

            const tests = [
                testProjects,
                testFiles,
                testKeywords,
                testSearch,
                testGraph,
                testConversations,
                testAgent,
                testAgentStatus,
                testThinkingModels,
                testSwotAnalysis,
                test5W2H,
                testSopTemplates,
                testSopValidate,
                testBusinessAnalyze,
                testTimelineGenerate,
                testNarrativeTemplates,
                testNarrativeGenerate,
                testMediaAccess,
                testIngestStatus,
                testStats
            ];

            for (const test of tests) {
                await test();
                await new Promise(resolve => setTimeout(resolve, 200));
            }
        }

        // 页面加载完成后的初始化
        window.addEventListener('load', () => {
            console.log('🧪 测试页面已加载');
            console.log('📡 FieldMindAPI 可用:', typeof window.FieldMindAPI !== 'undefined');
        });
    </script>
</body>
</html>
