<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传测试</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .drop-zone {
            border: 2px dashed #4a90e2;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .drop-zone:hover {
            background: #f0f8ff;
            border-color: #2563eb;
        }
        .drop-zone.drag-over {
            background: #e0f2ff;
            border-color: #1e40af;
        }
        .file-list {
            margin-top: 20px;
        }
        .file-item {
            padding: 10px;
            background: #f5f5f5;
            margin: 5px 0;
            border-radius: 4px;
        }
        .success { color: green; }
        .error { color: red; }
        button {
            padding: 10px 20px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #357abd; }
    </style>
</head>
<body>
    <h1>🧪 FieldMind 文件上传测试</h1>

    <!-- 测试1: 点击选择文件 -->
    <div class="test-section">
        <h2>测试1: 点击选择文件</h2>
        <input type="file" id="test1-input" multiple accept=".pdf,.jpg,.png,.txt,.docx">
        <button onclick="checkTest1()">检查选择的文件</button>
        <div id="test1-result"></div>
    </div>

    <!-- 测试2: 拖拽上传 -->
    <div class="test-section">
        <h2>测试2: 拖拽上传</h2>
        <div id="drop-zone" class="drop-zone">
            📁 拖拽文件到这里<br>
            或点击选择文件
        </div>
        <div id="test2-result" class="file-list"></div>
    </div>

    <!-- 测试3: 后端连接 -->
    <div class="test-section">
        <h2>测试3: 后端API连接</h2>
        <button onclick="testBackend()">测试后端连接</button>
        <div id="test3-result"></div>
    </div>

    <!-- 测试4: 实际上传 -->
    <div class="test-section">
        <h2>测试4: 实际上传到后端</h2>
        <input type="file" id="upload-input" multiple>
        <button onclick="uploadToBackend()">上传到后端</button>
        <div id="test4-result"></div>
    </div>

    <script>
        let selectedFiles = [];

        // 测试1: 检查文件选择
        function checkTest1() {
            const input = document.getElementById('test1-input');
            const result = document.getElementById('test1-result');

            if (input.files.length === 0) {
                result.innerHTML = '<p class="error">❌ 没有选择文件</p>';
                return;
            }

            result.innerHTML = '<p class="success">✅ 选择了 ' + input.files.length + ' 个文件:</p>';
            Array.from(input.files).forEach(file => {
                result.innerHTML += `<div class="file-item">${file.name} (${(file.size/1024).toFixed(2)} KB)</div>`;
            });
        }

        // 测试2: 拖拽功能
        const dropZone = document.getElementById('drop-zone');

        dropZone.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            input.onchange = (e) => handleFiles(e.target.files);
            input.click();
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            selectedFiles = Array.from(files);
            const result = document.getElementById('test2-result');

            result.innerHTML = '<p class="success">✅ 拖拽/选择了 ' + files.length + ' 个文件:</p>';
            selectedFiles.forEach(file => {
                result.innerHTML += `<div class="file-item">
                    📄 ${file.name} (${(file.size/1024).toFixed(2)} KB)
                </div>`;
            });
        }

        // 测试3: 后端连接
        async function testBackend() {
            const result = document.getElementById('test3-result');
            result.innerHTML = '<p>⏳ 连接中...</p>';

            try {
                const response = await fetch('http://localhost:8000/health');
                const data = await response.json();

                result.innerHTML = `
                    <p class="success">✅ 后端连接成功！</p>
                    <div class="file-item">
                        状态: ${data.status}<br>
                        响应时间: ${data.response_time_ms.toFixed(2)}ms
                    </div>
                `;
            } catch (error) {
                result.innerHTML = `
                    <p class="error">❌ 后端连接失败</p>
                    <div class="file-item">
                        错误: ${error.message}<br>
                        <br>
                        请确保后端已启动:<br>
                        <code>uvicorn app.main:app --reload</code>
                    </div>
                `;
            }
        }

        // 测试4: 实际上传
        async function uploadToBackend() {
            const input = document.getElementById('upload-input');
            const result = document.getElementById('test4-result');

            if (input.files.length === 0) {
                result.innerHTML = '<p class="error">❌ 请先选择文件</p>';
                return;
            }

            result.innerHTML = '<p>⏳ 上传中...</p>';

            const formData = new FormData();
            formData.append('project_id', '1'); // 测试项目ID
            formData.append('file', input.files[0]);

            try {
                const response = await fetch('http://localhost:8000/api/documents/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    result.innerHTML = `
                        <p class="success">✅ 上传成功！</p>
                        <div class="file-item">
                            文档ID: ${data.document_id}<br>
                            文件名: ${data.filename}<br>
                            状态: ${data.status}
                        </div>
                    `;
                } else {
                    const error = await response.text();
                    result.innerHTML = `
                        <p class="error">❌ 上传失败 (${response.status})</p>
                        <div class="file-item">${error}</div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <p class="error">❌ 上传失败</p>
                    <div class="file-item">${error.message}</div>
                `;
            }
        }

        // 页面加载时自动测试后端
        window.onload = () => {
            testBackend();
        };
    </script>
</body>
</html>
