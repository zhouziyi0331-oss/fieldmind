# AlertManager 配置文件
# 管理告警的路由、分组和通知

global:
  resolve_timeout: 5m
  # SMTP 配置 (Email 通知)
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@fieldmind.example.com'
  smtp_auth_username: 'alertmanager@fieldmind.example.com'
  smtp_auth_password: 'your-smtp-password'
  smtp_require_tls: true

# 告警路由规则
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s           # 等待同一组的告警聚合
  group_interval: 10s       # 发送同一组更新的间隔
  repeat_interval: 12h      # 重复告警的间隔
  receiver: 'default'       # 默认接收器

  # 子路由
  routes:
    # Critical 告警立即发送到多个渠道
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m

    # Warning 告警发送到普通渠道
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 1h

    # 数据库相关告警
    - match:
        category: database
      receiver: 'database-team'

    # 性能告警
    - match:
        category: performance
      receiver: 'ops-team'

# 告警接收器
receivers:
  # 默认接收器
  - name: 'default'
    webhook_configs:
      - url: 'http://backend:8000/api/webhooks/alerts'
        send_resolved: true

  # Critical 告警接收器（多渠道）
  - name: 'critical-alerts'
    email_configs:
      - to: 'ops-team@fieldmind.example.com'
        headers:
          Subject: '[CRITICAL] FieldMind Alert - {{ .GroupLabels.alertname }}'
        html: |
          <h2>Critical Alert</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
          <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>

    webhook_configs:
      - url: 'http://backend:8000/api/webhooks/alerts'
        send_resolved: true

    # 钉钉通知
    # webhook_configs:
    #   - url: 'https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN'
    #     send_resolved: true

    # 企业微信通知
    # wechat_configs:
    #   - corp_id: 'YOUR_CORP_ID'
    #     agent_id: 'YOUR_AGENT_ID'
    #     api_secret: 'YOUR_API_SECRET'

  # Warning 告警接收器
  - name: 'warning-alerts'
    email_configs:
      - to: 'dev-team@fieldmind.example.com'
        headers:
          Subject: '[WARNING] FieldMind Alert - {{ .GroupLabels.alertname }}'

  # 数据库团队
  - name: 'database-team'
    email_configs:
      - to: 'dba@fieldmind.example.com'
        headers:
          Subject: '[DATABASE] FieldMind Alert - {{ .GroupLabels.alertname }}'

  # 运维团队
  - name: 'ops-team'
    email_configs:
      - to: 'ops@fieldmind.example.com'
        headers:
          Subject: '[OPS] FieldMind Alert - {{ .GroupLabels.alertname }}'

# 告警抑制规则
inhibit_rules:
  # 如果服务宕机，抑制其他所有告警
  - source_match:
      severity: 'critical'
      alertname: 'ServiceDown'
    target_match_re:
      severity: 'warning|info'
    equal: ['instance']

  # 如果有 Critical 告警，抑制同一服务的 Warning
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
