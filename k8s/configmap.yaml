apiVersion: v1
kind: ConfigMap
metadata:
  name: fieldmind-backend-config
  namespace: fieldmind
data:
  # Application Config
  ENVIRONMENT: "production"
  DEBUG: "false"
  HOST: "0.0.0.0"
  PORT: "8000"

  # CORS
  CORS_ORIGINS: '["https://fieldmind.example.com"]'

  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # Neo4j
  NEO4J_URI: "bolt://neo4j-service:7687"
  NEO4J_USER: "neo4j"

  # Database
  DATABASE_URL: "sqlite:////app/data/fieldmind.db"

  # Storage Paths
  UPLOAD_DIR: "/app/uploads"
  REPORT_OUTPUT_DIR: "/app/reports"

---
apiVersion: v1
kind: Secret
metadata:
  name: fieldmind-backend-secret
  namespace: fieldmind
type: Opaque
stringData:
  # JWT Secret (替换为实际密钥)
  SECRET_KEY: "your-secret-key-change-in-production"

  # Neo4j Password
  NEO4J_PASSWORD: "fieldmind_password"

  # OpenAI API Key (optional)
  OPENAI_API_KEY: ""

  # Sentry DSN (optional)
  SENTRY_DSN: ""
