apiVersion: apps/v1
kind: Deployment
metadata:
  name: fieldmind-backend
  namespace: fieldmind
  labels:
    app: fieldmind-backend
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fieldmind-backend
  template:
    metadata:
      labels:
        app: fieldmind-backend
        tier: backend
    spec:
      containers:
      - name: backend
        image: fieldmind/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        # Environment from ConfigMap
        envFrom:
        - configMapRef:
            name: fieldmind-backend-config
        - secretRef:
            name: fieldmind-backend-secret

        # Resource limits
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        # Volume mounts
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: uploads
          mountPath: /app/uploads
        - name: reports
          mountPath: /app/reports

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Startup probe
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: fieldmind-backend-data
      - name: uploads
        persistentVolumeClaim:
          claimName: fieldmind-uploads
      - name: reports
        emptyDir: {}

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

---
apiVersion: v1
kind: Service
metadata:
  name: fieldmind-backend-service
  namespace: fieldmind
  labels:
    app: fieldmind-backend
spec:
  type: ClusterIP
  selector:
    app: fieldmind-backend
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
