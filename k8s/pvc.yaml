apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fieldmind-backend-data
  namespace: fieldmind
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

