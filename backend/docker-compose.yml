version: '3.8'

services:
  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: fieldmind-minio
    ports:
      - "9000:9000"      # API端口
      - "9001:9001"      # Console端口
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - fieldmind-network

  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: fieldmind-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fieldmind
      MYSQL_USER: fieldmind
      MYSQL_PASSWORD: fieldmind123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fieldmind-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: fieldmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - fieldmind-network

  # PostgreSQL向量数据库
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fieldmind-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fieldmind
      POSTGRES_PASSWORD: fieldmind123
      POSTGRES_DB: fieldmind_vectors
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldmind"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fieldmind-network

volumes:
  minio_data:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  fieldmind-network:
    driver: bridge
