[pytest]
# pytest 配置文件

# 测试发现
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 最小版本
minversion = 7.0

# 命令行选项
addopts =
    # 详细输出
    -v
    # 显示所有输出
    -s
    # 显示测试摘要
    -ra
    # 失败时显示局部变量
    -l
    # 严格标记
    --strict-markers
    # 覆盖率
    --cov=src/app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # 最小覆盖率（80%）
    --cov-fail-under=80
    # 并行执行
    -n auto
    # 显示最慢的10个测试
    --durations=10

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    slow: 慢速测试（>1秒）
    fast: 快速测试（<1秒）
    database: 需要数据库的测试
    storage: 需要对象存储的测试
    vector: 需要向量数据库的测试
    ai: 需要AI服务的测试
    smoke: 冒烟测试
    regression: 回归测试

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 警告
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# 覆盖率配置
[coverage:run]
source = src/app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
