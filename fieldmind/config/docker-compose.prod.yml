version: '3.8'

services:
  # ============================================================
  # PostgreSQL 数据库
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: fieldmind-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldmind_password}
      POSTGRES_DB: ${POSTGRES_DB:-fieldmind}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldmind"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fieldmind-network
    restart: unless-stopped

  # ============================================================
  # Redis 缓存
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: fieldmind-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fieldmind-network
    restart: unless-stopped

  # ============================================================
  # Neo4j 图数据库
  # ============================================================
  neo4j:
    image: neo4j:5-community
    container_name: fieldmind-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-fieldmind_neo4j}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - fieldmind-network
    restart: unless-stopped

  # ============================================================
  # Backend API
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fieldmind-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fieldmind}:${POSTGRES_PASSWORD:-fieldmind_password}@postgres:5432/${POSTGRES_DB:-fieldmind}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-fieldmind_neo4j}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: production
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fieldmind-network
    restart: unless-stopped

  # ============================================================
  # Celery Worker
  # ============================================================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fieldmind-celery-worker
    command: celery -A app.tasks worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fieldmind}:${POSTGRES_PASSWORD:-fieldmind_password}@postgres:5432/${POSTGRES_DB:-fieldmind}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-fieldmind_neo4j}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - fieldmind-network
    restart: unless-stopped

networks:
  fieldmind-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
